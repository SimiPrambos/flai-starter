flutter_test:
  image: ghcr.io/cirruslabs/flutter:3.41.9
  interruptible: true
  variables:
    PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  cache:
    key:
      files:
        - pubspec.lock
    paths:
      - .pub-cache/
  before_script:
    - export PATH="$PUB_CACHE/bin:$PATH"
  script:
    - cp .env.example .env
    - dart pub global activate very_good_cli
    - very_good packages get --recursive --ignore='!*'
    - dart run build_runner build --delete-conflicting-outputs
    - dart format --set-exit-if-changed lib test
    - flutter analyze lib test
    - |
      very_good test \
        -j 4 \
        --optimization \
        --coverage \
        --min-coverage 85 \
        --exclude-coverage "**/*.g.dart lib/core/firebase/** lib/core/theme/** lib/core/storage/secure_storage.dart" \
        --report-on "lib" \
        --show-uncovered \
        --test-randomize-ordering-seed random
