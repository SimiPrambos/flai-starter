name: domain
description: Scaffolds the domain layer for a feature — entity + repository interface
version: 0.1.0+1
environment:
  mason: ">=0.1.0-dev.47 <0.2.0"

vars:
  name:
    type: string
    description: Feature name in snake_case (e.g. payments, auth, order_items)
    prompt: "Feature name (snake_case):"
  app_package:
    type: string
    description: App package name from pubspec.yaml
    default: template_vgv_app
    prompt: "App package name:"
