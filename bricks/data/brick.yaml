name: data
description: Scaffolds the data layer for a feature — model, datasource, repo impl, providers, repo test
version: 0.1.0+1
environment:
  mason: ">=0.1.0-dev.47 <0.2.0"

vars:
  name:
    type: string
    description: Feature name in snake_case
    prompt: "Feature name (snake_case):"
  app_package:
    type: string
    description: App package name from pubspec.yaml
    default: template_vgv_app
    prompt: "App package name:"
