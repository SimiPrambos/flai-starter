name: template_vgv_app
description: Flutter enterprise template — Clean Architecture, Riverpod, GoRouter
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.29.0

dependencies:
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.0
  dio: ^5.7.0
  envied: ">=1.1.0 <1.2.0"
  firebase_analytics: ^12.4.0
  firebase_core: ^4.8.0
  firebase_crashlytics: ^5.2.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.2
  fpdart: ^1.1.0
  freezed_annotation: ^3.0.0
  gap: ^3.0.1
  go_router: ^16.0.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  retrofit: ^4.6.0
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.3.2
  skeletonizer: ^2.1.3
  talker: ^4.4.1
  talker_dio_logger: ^4.4.1
  talker_flutter: ^4.4.1
  talker_riverpod_logger: ^4.4.1

dev_dependencies:
  build_runner: ^2.4.13
  envied_generator: ^1.1.1
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  go_router_builder: ">=3.0.0 <3.2.0"
  json_serializable: ^6.8.0
  melos: ^7.7.0
  mocktail: ^1.0.4
  retrofit_generator: ^9.1.6
  riverpod_generator: ^2.6.3
  very_good_analysis: ^9.0.0

flutter:
  generate: true
  uses-material-design: true

melos:
  useRootAsPackage: true
  command:
    bootstrap:
      hooks:
        post: sh scripts/bootstrap.sh
  scripts:
    check:
      run: dart run build_runner build --delete-conflicting-outputs && flutter analyze && flutter test
      description: Full verification loop — build_runner → analyze → test
    test:
      run: sh scripts/test.sh
      description: "Run tests with coverage gate (min 85%). CI-safe."
    coverage:
      run: sh scripts/coverage.sh
      description: "Run tests, build HTML coverage report (opens it on macOS outside CI)."
    make-feature:
      run: mason make feature
      description: "Scaffold a new feature. Usage: melos make-feature -- --name <feature_name>"
    make-domain:
      run: mason make domain
      description: "Scaffold domain layer. Usage: melos make-domain -- --name <name>"
    make-data:
      run: mason make data
      description: "Scaffold data layer. Usage: melos make-data -- --name <name>"
    make-presentation:
      run: mason make presentation
      description: "Add a page. Usage: melos make-presentation -- --feature <feature> --name <name> --type <list|detail|single|static>"